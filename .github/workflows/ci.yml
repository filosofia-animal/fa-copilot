name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# El paquete lo van a consumir varios sistemas apuntando a un tag. Un cambio que
# pasa verde acá y se rompe recién en el sistema que actualiza es el peor de los
# casos: falla lejos de donde se originó y con días de diferencia. De ahí que
# typecheck, lint y tests corran acá y no sólo en los consumidores.
jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test
